#mariadb, phypmyadmin and car-db
version: "3.9"

services:
  db:
    image: mariadb:latest
    container_name: mariadb183_tresorapp
    environment:
      MYSQL_USER: user
      MYSQL_PASSWORD: 1234
      MYSQL_ROOT_PASSWORD: 1234
      MYSQL_DATABASE: default_schema
    ports:
      - "3306:3306"

  app:
    depends_on:
      - db
    image: phpmyadmin/phpmyadmin
    container_name: phpmyadmin183_tresorapp
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db

volumes:
  dbdata:
