spring.application.name=tresorbackend

#variables can be overwritten by environment variables
spring.datasource.url=jdbc:mysql://localhost:3306/tresordb
spring.datasource.username=root
spring.datasource.password=1234

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# do no sql schema hanlding (on startup)
spring.jpa.hibernate.ddl-auto=none

# do no sql init on startup, requires lazy configuration in code
spring.sql.init.mode=never

# do no hibernate validation on application startup to avoid exception if dbserver not active
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false

CROSS_ORIGIN=http://localhost:3000

# Sicherheitseinstellungen (Hashing)
# Der Pepper ist ein serverweiter Geheimschlüssel. Er wird vor dem Hashing an jedes Passwort angehängt.
# Sicherheitseffekt: Selbst wenn ein Angreifer vollen Zugriff auf die Datenbank hat, kann er die Hashes
# nicht ohne diesen Schlüssel (der nur auf dem Applikationsserver liegt) angreifen.
security.pepper=MeinSuperGeheimerTresorPasswortPepperMitVielEntropie123!

# ReCaptcha Secret Key
recaptcha.secret.key=6LeovAwtAAAAACTftPlfj5CRkZMMbkD2Qcb8Z9nz

# JWT Configuration
jwt.secret=dGhpc0lzQVZlcnlTZWN1cmVTZWNyZXRLZXlGb3JUcmVzb3JBcHBsaWNhdGlvbjIwMjQ=
jwt.access-token-expiration=900000
jwt.refresh-token-expiration=604800000

# Google OAuth2 (User must configure their own credentials)
spring.security.oauth2.client.registration.google.client-id=YOUR_GOOGLE_CLIENT_ID
spring.security.oauth2.client.registration.google.client-secret=YOUR_GOOGLE_CLIENT_SECRET
spring.security.oauth2.client.registration.google.scope=openid,profile,email

# Frontend URL for OAuth2 redirect
app.frontend.url=http://localhost:3000